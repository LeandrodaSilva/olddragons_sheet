# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools
#
# O job "test" valida o código (testes + build web) e não depende de nenhum
# secret. O deploy do preview roda em um job separado, que só executa após o
# "test" passar — assim a falha de credencial do Firebase não derruba a
# validação do código.

name: CI e Preview no PR
"on": pull_request
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
      - run: flutter --version
      - run: flutter pub get
      - run: flutter test
      - run: flutter build web

  deploy_preview:
    needs: test
    if: "${{ github.event.pull_request.head.repo.full_name == github.repository }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
      - run: flutter pub get
      - run: flutter build web
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_OLDDRAGONS_SHEET }}"
          projectId: olddragons-sheet
