# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools
#
# O job "test" valida o código (testes + build web) e não depende de nenhum
# secret. O deploy para produção roda em um job separado, que só executa após
# o "test" passar.

name: CI e Deploy no merge
"on":
  push:
    branches:
      - master
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
      - run: flutter --version
      - run: flutter pub get
      - run: flutter test
      - run: flutter build web

  deploy_live:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
      - run: flutter pub get
      - run: flutter build web
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_OLDDRAGONS_SHEET }}"
          channelId: live
          projectId: olddragons-sheet
